org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where installed apps look for new versions
updateManifestUrl=https://github.com/rylmo/schoolday/releases/latest/download/update.json

# iPhone targets can only be built on a Mac (GitHub Actions); skip them on Windows.
kotlin.native.ignoreDisabledTargets=true
