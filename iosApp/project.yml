# Xcode project definition (generated into Schoolday.xcodeproj by XcodeGen on the build machine).
name: Schoolday
options:
  bundleIdPrefix: app.schoolday
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Schoolday:
    type: application
    platform: iOS
    sources:
      - Schoolday
    dependencies:
      # The home screen widget, embedded in the app as Schoolday.app/PlugIns.
      - target: SchooldayWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.schoolday.ios
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    info:
      path: Schoolday/Info.plist
      properties:
        CFBundleDisplayName: Schoolday
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        # schoolday://timetable/<class id>, opened by tapping the widget
        CFBundleURLTypes:
          - CFBundleURLName: app.schoolday.ios
            CFBundleURLSchemes:
              - schoolday
        UILaunchScreen:
          UIColorName: LaunchColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    preBuildScripts:
      - name: Build shared Kotlin code
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --console=plain
  SchooldayWidget:
    type: app-extension
    platform: iOS
    # Configurable, interactive widgets need iOS 17; the app itself still runs on 16.
    deploymentTarget: "17.0"
    sources:
      - SchooldayWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.schoolday.ios.widget
        TARGETED_DEVICE_FAMILY: "1"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_BITCODE: NO
        SKIP_INSTALL: YES
    info:
      path: SchooldayWidget/Info.plist
      properties:
        CFBundleDisplayName: Schoolday
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
