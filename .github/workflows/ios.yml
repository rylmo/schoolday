# Builds an unsigned iPhone app (.ipa) that SideStore can sign and install.
# Every push is a TEST build, published to the "ios-testing" pre-release; only phones with
# Settings › Test builds on are offered it. The stable "ios-test" release (what testers and
# the Windows setup get) changes only through the "Promote iOS test build" workflow.
# Neither is marked latest, so Android's updater (releases/latest) never sees them.
name: iOS build

on:
  push:
    branches: [ios-experimental]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      - name: Generate Xcode project
        working-directory: iosApp
        run: |
          brew install xcodegen ldid
          xcodegen generate

      - name: Build
        working-directory: iosApp
        run: |
          xcodebuild -version
          xcodebuild build \
            -project Schoolday.xcodeproj \
            -scheme Schoolday \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        working-directory: iosApp
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Schoolday.app Payload/
          # SideStore requests the entitlements it finds in the app's signature, and the build
          # is unsigned; a placeholder signature carries the app group the widgets share with
          # the app (SideStore registers it under its own team-specific name).
          cat > groups.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.application-groups</key>
            <array><string>group.app.schoolday.ios</string></array>
          </dict></plist>
          PLIST
          ldid -Sgroups.entitlements Payload/Schoolday.app/PlugIns/SchooldayWidget.appex/SchooldayWidget
          ldid -Sgroups.entitlements Payload/Schoolday.app/Schoolday
          ldid -e Payload/Schoolday.app/Schoolday
          zip -qry Schoolday-iOS.ipa Payload
          ls -la Schoolday-iOS.ipa
          # The app compares versionCode with its own build number to offer updates;
          # marketingVersion lets the promote workflow name the stable copy.
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Payload/Schoolday.app/Info.plist)
          SHA=$(shasum -a 256 Schoolday-iOS.ipa | cut -d' ' -f1)
          jq -n --argjson code "${{ github.run_number }}" --arg version "$VERSION" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/ios-testing/Schoolday-iOS.ipa" --arg sha "$SHA" \
            '{versionCode: $code, versionName: "\($version) · test \($code)", marketingVersion: $version, url: $url, sha256: $sha}' > ios-update.json
          cat ios-update.json

      - name: Publish test build
        working-directory: iosApp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-testing --yes --cleanup-tag || true
          gh release create ios-testing Schoolday-iOS.ipa ios-update.json \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Schoolday for iPhone: test build ${{ github.run_number }}" \
            --notes "Test build for phones with Settings › Test builds turned on. Built from $GITHUB_SHA. Run the \"Promote iOS test build\" workflow to make it the stable release."
