# Builds an unsigned iPhone app (.ipa) that SideStore can sign and install.
# The result is attached to the "ios-test" pre-release, which never affects Android updates.
name: iOS build

on:
  push:
    branches: [ios-experimental]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      - name: Generate Xcode project
        working-directory: iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        working-directory: iosApp
        run: |
          xcodebuild -version
          xcodebuild build \
            -project Schoolday.xcodeproj \
            -scheme Schoolday \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        working-directory: iosApp
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Schoolday.app Payload/
          zip -qry Schoolday-iOS.ipa Payload
          ls -la Schoolday-iOS.ipa

      - name: Publish test build
        working-directory: iosApp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-test --yes --cleanup-tag || true
          gh release create ios-test Schoolday-iOS.ipa \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Schoolday for iPhone (experimental)" \
            --notes "Unsigned test build for SideStore. Built from $GITHUB_SHA."
